# Target server has no containers and runs Java/Tomcat as unprivileged users.
# Keep privileged BPF available for security agents while closing the
# unprivileged local attack path used by several verifier CVEs.
kernel.unprivileged_bpf_disabled = 1
user.max_user_namespaces = 0
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.perf_event_paranoid = 3
